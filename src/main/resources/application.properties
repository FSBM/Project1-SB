spring.application.name=ride-sharing-api

# MongoDB URI must be set via SPRING_DATA_MONGODB_URI environment variable
# Example: mongodb+srv://user:password@cluster.mongodb.net/database?retryWrites=true&w=majority

server.port=${PORT:8080}

spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}

frontend.url=${FRONTEND_URL:https://rideshare-client-blond.vercel.app}
