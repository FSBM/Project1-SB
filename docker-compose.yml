version: '3.8'

services:
  ride-sharing-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI:-mongodb+srv://shyam24bcs10094_db_user:eOfovhHBb4H6CLCI@cluster0.iwjkgwf.mongodb.net/ridesharing?retryWrites=true&w=majority}
      - SPRING_DATA_MONGODB_DATABASE=${MONGODB_DATABASE:-ridesharing}
      - SERVER_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
